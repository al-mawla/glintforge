name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.4.1 }
      - run: gradle build --no-daemon
      - name: Inspect Minecraft classes
        if: always()
        run: |
          JAR=""
          for j in $(find ~/.gradle -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/renderer/feature/ItemFeatureRenderer.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR" > inspect.txt
          for c in 'net.minecraft.client.renderer.rendertype.RenderSetup$RenderSetupBuilder' net.minecraft.client.renderer.item.ItemModelResolver; do
            javap -p -cp "$JAR" "$c" >> inspect.txt 2>&1
          done
          javap -p -cp "$JAR" com.mojang.blaze3d.systems.RenderSystem 2>&1 | grep -i sampler >> inspect.txt || true
          SC=$(unzip -l "$JAR" | grep -o 'com/mojang/blaze3d/[A-Za-z/]*SamplerCache.class' | head -1 | sed 's/.class$//; s#/#.#g')
          if [ -n "$SC" ]; then javap -p -cp "$JAR" "$SC" >> inspect.txt 2>&1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc-inspect
          path: inspect.txt
      - uses: actions/upload-artifact@v4
        with:
          name: glintforge-jar
          path: build/libs/glintforge-*.jar
